<style>
:root{--bg:#000;--s1:#0E0E10;--s2:#070708;--ln:#202024;--ln2:#2C2C32;--fg:#F4F4F5;--mut:#9A9AA3;--sub:#D4D4D8;
  --ac:#38BDF8;--gr:#34D399;--grl:#86EFAC;--grbg:#03140D;--grln:#14532D;--rd:#F87171;--rdbg:#1A0606;--rdln:#7F1D1D;
  --or:#FB923C;--orl:#FDBA74;--orbg:#170B02;--orln:#7C2D12;--cy:#22D3EE;--cyl:#67E8F9;--cybg:#03141A;--cyln:#155E75;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,p{margin:0}
.num{font-family:"SF Pro Display",-apple-system,"Space Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
#gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;padding-top:calc(24px + var(--sat));max-width:420px;margin:0 auto;gap:12px}
#gate h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
#gate p{color:var(--mut);font-size:15px}
#gate input{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--ln2);background:var(--s1);font-size:17px}
#gate button{height:52px;border-radius:14px;border:0;background:var(--ac);color:#000;font-weight:700;font-size:17px}
#err{color:var(--rd);font-size:14px;min-height:20px}
#app{display:flex;flex-direction:column;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + var(--sat)) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header .k{font-size:13px;color:var(--mut)}
header h1{font-size:30px;font-weight:700;letter-spacing:-.6px;margin-top:2px}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--ln2);background:var(--s1);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;background:var(--gr)}
main{flex:1;padding:4px 20px calc(96px + var(--sab));display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
.per{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.per::-webkit-scrollbar{display:none}
.per button{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--ln2);background:var(--s1);color:var(--sub);font-size:13px;font-weight:500}
.per button[aria-pressed="true"]{background:var(--fg);color:#000;border-color:var(--fg);font-weight:600}
.dates{display:none;gap:8px}
.dates.on{display:flex}
.dates label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.dates input{height:40px;border-radius:10px;border:1px solid var(--ln2);background:var(--s1);padding:0 10px;font-size:15px;color-scheme:dark}
.plab{font-size:13px;color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lab{font-size:13px;font-weight:600}
.small{font-size:12px;color:var(--mut);line-height:1.4}
.hero{border-radius:22px;padding:18px}
.hero .v{font-size:46px;margin-top:6px}
.k2 .v{font-size:30px;margin-top:6px}
.k3 .v{font-size:20px;margin-top:4px}
.bar{height:6px;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:6px;border-radius:3px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:15px;font-weight:600}
.list{background:var(--s1);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .t{flex:1;font-size:14px;line-height:1.35}
.row .t small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.row .r{font-size:13px;color:var(--sub);text-align:right;white-space:nowrap}
.empty{padding:16px;font-size:13px;color:var(--mut);line-height:1.5;border:1px dashed var(--ln2);border-radius:18px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;letter-spacing:.2px}
.p-good{background:var(--grbg);color:var(--grl);border:1px solid var(--grln)}
.p-bad{background:var(--rdbg);color:#FCA5A5;border:1px solid var(--rdln)}
.p-warn{background:var(--orbg);color:var(--orl);border:1px solid var(--orln)}
.p-mut{background:var(--s2);color:var(--mut);border:1px solid var(--ln2)}
.book{display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bh b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font-size:11px;color:var(--mut)}
.stats b{font-size:15px}
.camp{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.camp .ty{font-size:10.5px;font-weight:700;letter-spacing:.8px}
.camp .ln{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);gap:8px;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.chart .c i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.chart .c i.neg{border-radius:0 0 3px 3px}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:6px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--ln2);background:var(--s1);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
.cats button[aria-pressed="false"]{opacity:.4}
.cats button i{width:8px;height:8px;border-radius:4px;display:block}
.day{font-size:12px;font-weight:600;color:var(--mut);text-transform:capitalize;padding:6px 2px 0}
.alert{background:var(--orbg);border:1px solid var(--orln);border-radius:18px;padding:14px;display:flex;gap:12px}
.alert b{font-size:14px}
.alert p{font-size:13px;line-height:1.4;color:#E5C690;margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;border-top:1px solid var(--ln);background:rgba(5,5,6,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 0 calc(8px + var(--sab))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;min-height:44px;font-size:11px;color:var(--mut)}
nav button[aria-selected="true"]{color:var(--ac);font-weight:600}
.foot{font-size:11.5px;color:var(--mut);line-height:1.5;text-align:center;padding:4px 10px}
.refresh{background:none;border:0;color:var(--ac);font-size:13px;font-weight:600;padding:8px}
.sw{flex:none;width:52px;height:32px;border-radius:16px;border:0;padding:3px;display:flex;background:var(--ln2);justify-content:flex-start;transition:background .15s}
.sw i{width:26px;height:26px;border-radius:13px;background:var(--mut);display:block;transition:background .15s}
.sw[aria-checked="true"]{background:var(--ac);justify-content:flex-end}
.sw[aria-checked="true"] i{background:#000}
.sw:disabled{opacity:.45}
.lock{flex:none;font-size:11px;color:var(--mut);border:1px solid var(--ln2);border-radius:8px;padding:3px 7px}
.btn{height:46px;border-radius:14px;border:0;background:var(--ac);color:#000;font-weight:700;font-size:15px;padding:0 16px}
.btn2{height:40px;border-radius:12px;border:1px solid var(--ln2);background:var(--s1);color:var(--sub);font-weight:600;font-size:13px;padding:0 14px}
.inp{width:100%;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--ln2);background:var(--s2);font-size:15px}
.msg{font-size:13px;line-height:1.4;padding:10px 12px;border-radius:12px}
.msg.ok{background:var(--grbg);color:var(--grl);border:1px solid var(--grln)}
.msg.ko{background:var(--rdbg);color:#FCA5A5;border:1px solid var(--rdln)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sab));z-index:9;background:#18181B;border:1px solid var(--ln2);color:var(--fg);font-size:13px;padding:10px 14px;border-radius:12px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Ads KDP</h1>
  <p>Inserisci la password della dashboard. La chiede una volta sola su questo telefono.</p>
  <form id="f" style="display:flex;flex-direction:column;gap:12px">
    <label for="pw" class="small">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Entra</button>
  </form>
  <div id="err" role="alert"></div>
</div>

<div id="app" hidden>
  <header>
    <div><p class="k" id="hk">—</p><h1 id="ht">Oggi</h1></div>
    <span class="chip"><span class="dot" id="hdot"></span>KDP · US</span>
  </header>
  <main id="main"></main>
  <nav aria-label="Menu" role="tablist">
    <button type="button" role="tab" data-v="oggi" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Oggi</button>
    <button type="button" role="tab" data-v="camp" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Campagne</button>
    <button type="button" role="tab" data-v="reg" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Regole</button>
    <button type="button" role="tab" data-v="avv" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Avvisi</button>
  </nav>
</div>

<script>
(function(){
'use strict';
var KEY='adsapp_pw', DATA_URL='../data.enc.json', SOGLIA_SPESA=40, DAY=86400000;
var REPO='Loreminee/ads-dashboard', IMP_FILE='impostazioni.enc.json', TOK='adsapp_tok';
var VAPID='BIANQBveuHd9JuPFlsu52DV6xSYoU9br4WJk7NRgjghxHOCXB4cePdUx1NkznMqhrihcZ-p7Gq_CTGZ1Q3D3hWs';
var IMP={regole_off:[],notifiche_off:[],push:[]}, IMP_SHA=null, IMP_OK=false, PW=null;
var NOTIF=[['vendita','Nuove vendite'],['budget','Budget finiti e alzati'],['spesa','Spesa sopra $40'],['modifiche','Modifiche del bot'],['riepilogo','Riepiloghi 9:00 e 20:00'],['errori','Errori e ritardi'],['altro','Altri messaggi']];
var D=null, ST={v:'oggi', q:'oggi', from:null, to:null, cats:{}};
try{ var sv=localStorage.getItem('adsapp_v'); if(sv) ST.v=sv; }catch(_){}

// ---------- utilità
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function num(x){ return Number(x)||0; }
function money(v){ if(v==null||isNaN(v)) return '$ —'; var s=Math.abs(v).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?'−$':'$')+s; }
function money0(v){ if(v==null||isNaN(v)) return '$ —'; return (v<0?'−$':'$')+Math.round(Math.abs(v)).toLocaleString('it-IT'); }
function pct(v){ return v==null||isNaN(v) ? '— %' : (v*100).toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function int(v){ return Math.round(num(v)).toLocaleString('it-IT'); }
function isoUTC(d){ return d.toISOString().slice(0,10); }
function parse(s){ return new Date(s+'T00:00:00Z'); }
function addDays(s,n){ return isoUTC(new Date(parse(s).getTime()+n*DAY)); }
function nDays(a,b){ return Math.round((parse(b)-parse(a))/DAY)+1; }
function romaOggi(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome'}).format(new Date()); }
function dataLunga(s){ return parse(s).toLocaleDateString('it-IT',{timeZone:'UTC',weekday:'short',day:'numeric',month:'long'}); }
function dataBreve(s){ return parse(s).toLocaleDateString('it-IT',{timeZone:'UTC',day:'numeric',month:'short'}); }
function oraIt(iso){ if(!iso) return 'mai'; var d=new Date(iso); if(isNaN(d)) return String(iso); return d.toLocaleString('it-IT',{timeZone:'Europe/Rome',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function base(libro){ return String(libro||'').replace(/ \((KDP|PublishDrive)\)$/,''); }
var NOMI={FLORIDA:'Florida Road Atlas',ADAMS:'Adams Chart',AUTISM:'Autism Workbook',WALIPINI:'Walipini',LOST:'Lost Skills',LOSTSKILL:'Lost Skills','LOST SKILL':'Lost Skills','LOST SKILLS':'Lost Skills',RV:'RV Road','RV ROAD':'RV Road',RVROAD:'RV Road',FACT:'Fact or Flush?',IPHONE:'iPhone Guide','FUN FACT':'Fact or Flush?',FUNFACT:'Fact or Flush?'};
function nome(libro){ var b=base(libro), u=b.toUpperCase(); if(NOMI[u]) return NOMI[u]; return b.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();}); }
function profilo(libro){ var P=(D&&D.profili)||{}, b=base(libro); if(P.KDP&&P.KDP[b]) return P.KDP[b]; for(var a in P){ if(P[a]&&P[a][b]) return P[a][b]; } return null; }
function royalty(libro){ var p=profilo(libro); return p&&p.royalty!=null ? num(p.royalty) : null; }
function pareggio(libro){ var p=profilo(libro); return p&&p.prezzo ? num(p.royalty)/num(p.prezzo) : null; }

// ---------- dati
function righe(){ return (D&&D.righe)||[]; }
function limiti(){
  var d=righe().map(function(x){return x.data;}).filter(Boolean).sort(), o=romaOggi();
  if(!d.length) return {min:o,max:o};
  return {min:d[0], max:(o>d[d.length-1]?o:d[d.length-1])};
}
function periodo(){
  var L=limiti(), mx=L.max, f, t=mx;
  if(ST.q==='oggi') f=mx;
  else if(ST.q==='ieri'){ f=t=addDays(mx,-1); }
  else if(ST.q==='7g') f=addDays(mx,-6);
  else if(ST.q==='30g') f=addDays(mx,-29);
  else if(ST.q==='mese') f=mx.slice(0,7)+'-01';
  else if(ST.q==='tutto') f=L.min;
  else { f=ST.from||mx; t=ST.to||mx; if(f>t){ var z=f; f=t; t=z; } }
  if(f<L.min) f=L.min; if(t<L.min) t=L.min;
  return {from:f,to:t,L:L};
}
function inP(P){ return function(x){ return x.data>=P.from && x.data<=P.to; }; }
function tot(rows){
  var t={spesa:0,vendite:0,ordini:0,click:0,impression:0,royalty:0,senzaRoy:{}};
  rows.forEach(function(x){
    t.spesa+=num(x.spesa); t.vendite+=num(x.vendite); t.ordini+=num(x.ordini); t.click+=num(x.click); t.impression+=num(x.impression);
    var r=royalty(x.libro); if(r==null){ if(num(x.ordini)) t.senzaRoy[nome(x.libro)]=1; } else t.royalty+=num(x.ordini)*r;
  });
  t.profitto=t.royalty-t.spesa;
  t.acos=t.vendite? t.spesa/t.vendite : null;
  t.pareggio=t.vendite? t.royalty/t.vendite : null;
  t.ctr=t.impression? t.click/t.impression : null;
  t.cpc=t.click? t.spesa/t.click : null;
  return t;
}
function group(rows,key){ var m={}, o=[]; rows.forEach(function(x){ var k=typeof key==='function'?key(x):x[key]; if(!(k in m)){ m[k]=[]; o.push(k); } m[k].push(x); }); return o.map(function(k){ return [k,m[k]]; }); }

// ---------- pezzi di interfaccia
function periodoUI(P){
  var wrap=el('div','sec');
  var bar=el('div','per'); bar.setAttribute('role','group'); bar.setAttribute('aria-label','Periodo');
  [['oggi','Oggi'],['ieri','Ieri'],['7g','7 giorni'],['30g','30 giorni'],['mese','Questo mese'],['tutto','Tutto'],['date','Date…']].forEach(function(q){
    var b=el('button',null,q[1]); b.type='button'; b.setAttribute('aria-pressed', ST.q===q[0]?'true':'false');
    b.onclick=function(){ if(q[0]==='date'){ ST.from=P.from; ST.to=P.to; } ST.q=q[0]; render(); };
    bar.appendChild(b);
  });
  wrap.appendChild(bar);
  var dt=el('div','dates'+(ST.q==='date'?' on':''));
  [['Dal','from'],['Al','to']].forEach(function(x){
    var l=el('label',null,x[0]), i=el('input'); i.type='date'; i.min=P.L.min; i.max=P.L.max; i.value=x[1]==='from'?P.from:P.to;
    i.onchange=function(){ if(i.value){ ST[x[1]]=i.value; ST.q='date'; render(); } };
    l.appendChild(i); dt.appendChild(l);
  });
  wrap.appendChild(dt);
  var n=nDays(P.from,P.to);
  wrap.appendChild(el('p','plab', n===1 ? dataLunga(P.to) : 'Dal '+dataBreve(P.from)+' al '+dataBreve(P.to)+' · '+n+' giorni'));
  return wrap;
}
function kpi(cls,style,label,val,sub,extra){
  var c=el('div',cls); c.setAttribute('style',style);
  var top=el('div'); top.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px';
  top.appendChild(label); if(sub) top.appendChild(sub); c.appendChild(top);
  c.appendChild(val); if(extra) extra.forEach(function(e){ c.appendChild(e); }); return c;
}
function lab(txt,color){ var p=el('p','lab',txt); p.style.color=color; return p; }
function big(txt,color){ var p=el('p','v num',txt); p.style.color=color; return p; }

// ---------- schermata OGGI
function vOggi(m){
  var P=periodo(), rows=righe().filter(inP(P)), t=tot(rows), n=nDays(P.from,P.to);
  m.appendChild(periodoUI(P));
  var pos=t.profitto>=0;
  var heroStyle=pos?'background:var(--grbg);border:1px solid var(--grln)':'background:var(--rdbg);border:1px solid var(--rdln)';
  var extra=[];
  var ns=Object.keys(t.senzaRoy); if(ns.length) extra.push(el('p','small','Senza royalty nel bot: '+ns.join(', ')));
  m.appendChild(kpi('hero',heroStyle, lab(n===1?'Profitto del giorno':'Profitto del periodo', pos?'var(--grl)':'#FCA5A5'),
    big(money(t.profitto), pos?'var(--gr)':'var(--rd)'), el('p','small','royalty da Ads − spesa'), extra));

  var g=el('div','g2');
  var media=t.spesa/n, quota=Math.min(1, media/SOGLIA_SPESA);
  var b=el('div','bar'); b.style.background='#2A1406'; var bi=el('i'); bi.style.width=(quota*100).toFixed(1)+'%'; bi.style.background=media>SOGLIA_SPESA?'var(--rd)':'var(--or)'; b.appendChild(bi);
  g.appendChild(kpi('card k2','background:var(--orbg);border-color:var(--orln)', lab('Spesa','var(--orl)'), big(money(t.spesa),'var(--or)'), null,

function u8b64(u){ var s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
async function cifra(doc,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=200000;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(doc))));
  return {v:1,iter:iter,salt:u8b64(salt),iv:u8b64(iv),ct:u8b64(ct)};
}

async function leggiImp(){

    var enc=null;

      if(r.status===404){ IMP_SHA=null; IMP=normImp({}); IMP_OK=true; return true; }
      if(!r.ok) throw new Error('GitHub '+r.status);

    } else {

    var r=await api(IMP_FILE,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
    if(r.ok){ var j=await r.json(); IMP_SHA=j.content&&j.content.sha; IMP=nuovo; return true; }
    if(r.status===401||r.status===403){ toast('Chiave GitHub non valida o senza permesso di scrittura.'); return false; }
    if(r.status!==409&&r.status!==422){ toast('Salvataggio non riuscito (GitHub '+r.status+').'); return false; }
  }
  toast('Salvataggio non riuscito: riprova tra poco.'); return false;
}
function sw(on,label,onchange,disabled){
  var b=el('button','sw'); b.type='button'; b.setAttribute('role','switch'); b.setAttribute('aria-checked',on?'true':'false'); b.setAttribute('aria-label',label);
  if(disabled) b.disabled=true; b.appendChild(el('i'));
  b.onclick=async function(){ if(b.disabled) return; var v=b.getAttribute('aria-checked')!=='true'; b.disabled=true; b.setAttribute('aria-checked',v?'true':'false');
    var ok=await onchange(v); if(!ok) b.setAttribute('aria-checked',v?'false':'true'); b.disabled=false; if(ok){ ST._keep=true; render(); } };
  return b;
}
function b64u(s){ var p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function installata(){ return window.navigator.standalone===true || (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); }
async function attivaNotifiche(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){ toast(installata()?'Questo telefono non supporta le notifiche delle web app.':'Prima aggiungi l\'app alla schermata Home e aprila da lì.'); return false; }
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Notifiche non consentite. Puoi attivarle in Impostazioni › Notifiche › Ads KDP.'); return false; }
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  var j=sub.toJSON();
  var ok=await salvaImp(function(d){ d.push=(d.push||[]).filter(function(x){ return x&&x.endpoint!==j.endpoint; }); d.push.push({endpoint:j.endpoint,keys:j.keys,telefono:'iPhone',dal:new Date().toISOString()}); });
  if(ok){ try{ localStorage.setItem('adsapp_endpoint',j.endpoint); }catch(_){} toast('Notifiche attive: la prova arriva entro mezz\'ora.'); }
  return ok;
}
async function statoNotifiche(){
  try{ if(!('serviceWorker' in navigator)||!('PushManager' in window)) return 'no';
    var reg=await navigator.serviceWorker.getRegistration(); var sub=reg&&await reg.pushManager.getSubscription();
    if(!sub) return 'off'; return IMP.push.some(function(x){ return x.endpoint===sub.endpoint; })?'on':'off'; }catch(_){ return 'no'; }
}

// ---------- render
var VIEWS={oggi:['Oggi',vOggi],camp:['Campagne',vCamp],reg:['Regole',vReg],avv:['Avvisi',vAvv]};
function render(){
  if(!D) return;
  var m=$('main'), v=VIEWS[ST.v]||VIEWS.oggi, y=window.scrollY;
  $('ht').textContent=v[0];
  var age=D.aggiornato? (Date.now()-new Date(D.aggiornato).getTime())/60000 : null;
  $('hk').textContent='Aggiornato '+oraIt(D.aggiornato);
  $('hdot').style.background= age!=null && age<90 ? 'var(--gr)' : 'var(--or)';
  m.replaceChildren();
  try{ v[1](m); }catch(e){ m.appendChild(el('div','empty','Errore nel mostrare i dati: '+e.message)); }
  var rb=el('button','refresh','Aggiorna dati'); rb.type='button'; rb.onclick=function(){ rb.textContent='Aggiorno…'; carica(pwSalvata(),true).then(function(ok){ if(!ok) rb.textContent='Non riuscito, riprova'; }); };
  var w=el('div'); w.style.textAlign='center'; w.appendChild(rb); m.appendChild(w);
  document.querySelectorAll('nav button').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-v')===ST.v?'true':'false'); });
  window.scrollTo(0, ST._keep? y : 0); ST._keep=false;
}
document.querySelectorAll('nav button').forEach(function(b){ b.onclick=function(){ ST.v=b.getAttribute('data-v'); try{ localStorage.setItem('adsapp_v',ST.v); }catch(_){} render(); }; });

// ---------- dati cifrati (stesso formato della dashboard)
function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function decifra(enc,pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function pwSalvata(){ try{ return localStorage.getItem(KEY); }catch(_){ return null; } }
async function carica(pw,silenzioso){
  var err=$('err'), r;
  try{ r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); }catch(e){ if(!silenzioso) err.textContent='Nessuna connessione.'; else if(D) render(); return false; }
  if(!r.ok){ if(!silenzioso) err.textContent='Dati non ancora pubblicati. Riprova tra poco.'; return false; }
  var enc=await r.json(), doc;
  try{ doc=await decifra(enc,pw); }catch(e){ if(!silenzioso) err.textContent='Password sbagliata.'; try{ localStorage.removeItem(KEY); }catch(_){} return false; }
  try{ localStorage.setItem(KEY,pw); }catch(_){}
  PW=pw; await leggiImp();
  D=doc; $('gate').hidden=true; $('app').hidden=false; ST._keep=true; render(); return true;
}
$('f').addEventListener('submit',function(e){ e.preventDefault(); $('err').textContent=''; carica($('pw').value,false); });
var sp=pwSalvata();
if(sp) carica(sp,true).then(function(ok){ if(!ok) $('gate').hidden=false; }); else $('gate').hidden=false;
setInterval(function(){ var p=pwSalvata(); if(p&&!document.hidden) carica(p,true); },300000);
document.addEventListener('visibilitychange',function(){ var p=pwSalvata(); if(!document.hidden&&p&&D) carica(p,true); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(ev){ if(ev.data&&ev.data.vista&&VIEWS[ev.data.vista]){ ST.v=ev.data.vista; render(); } }); }
try{ var qv=new URLSearchParams(location.search).get('v'); if(qv&&VIEWS[qv]) ST.v=qv; }catch(_){}
})();
